[platformio]
default_envs = esp32
core_dir = build/platformio-core
workspace_dir = build/pio

[env:esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.f_cpu = 240000000L
; Mesmos parametros de flash do FQBN esp32:esp32:esp32 validado.
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = default.csv
board_upload.flash_size = 4MB
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
lib_deps =
    AcompanhamentoJogada=symlink://../acompanhamento
    TabuleiroChess=symlink://../xadrez
    InterpretacaoJogada=symlink://../interpretacao
    ControlePartida=symlink://../controle
    RegistroPartida=symlink://../registro
